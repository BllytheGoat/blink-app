<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#171717">
    <meta name="description" content="Blink — Secure P2P file transfer with zero accounts">
    <title>Blink</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23171717' width='192' height='192'/><text x='50%' y='50%' font-size='120' fill='white' text-anchor='middle' dominant-baseline='middle' font-weight='600'>B</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23171717' width='192' height='192' rx='48'/><text x='50%' y='50%' font-size='120' fill='white' text-anchor='middle' dominant-baseline='middle' font-weight='600'>B</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --canvas: #ffffff;
            --canvas-soft: #fafafa;
            --canvas-soft-2: #f5f5f5;
            --ink: #171717;
            --body: #4d4d4d;
            --mute: #888888;
            --hairline: #ebebeb;
            --link: #0070f3;
            --gradient-develop-start: #007cf0;
            --gradient-develop-end: #00dfd8;
            --gradient-preview-start: #7928ca;
            --gradient-preview-end: #ff0080;
            --font-sans: "Inter", -apple-system, system-ui, sans-serif;
            --font-mono: "JetBrains Mono", "Courier New", monospace;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: var(--font-sans);
            background-color: var(--canvas-soft);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #app {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: auto;
            -webkit-user-select: none;
            user-select: none;
        }

        .screen {
            display: none;
            flex: 1;
            padding: 24px 16px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 32px;
        }

        .screen.active {
            display: flex;
        }

        .hero {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .display-xl {
            font-size: 48px;
            font-weight: 600;
            line-height: 48px;
            letter-spacing: -2.4px;
        }

        .body-lg {
            font-size: 18px;
            font-weight: 400;
            line-height: 28px;
            color: var(--body);
        }

        .cta-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border-radius: 100px;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            font-family: var(--font-sans);
            transition: all 0.2s ease;
            min-width: 120px;
        }

        .button-primary {
            background-color: var(--ink);
            color: white;
        }

        .button-primary:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .button-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .button-secondary {
            background-color: var(--canvas);
            color: var(--ink);
            border: 1px solid var(--hairline);
        }

        .button-secondary:hover:not(:disabled) {
            background-color: var(--canvas-soft-2);
        }

        .back-btn {
            align-self: flex-start;
            background: none;
            border: none;
            color: var(--link);
            font-size: 14px;
            cursor: pointer;
            padding: 8px;
            margin: -8px 0 16px -8px;
        }

        .view {
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-self: stretch;
        }

        .display-md {
            font-size: 24px;
            font-weight: 600;
            line-height: 32px;
            letter-spacing: -0.96px;
            margin-bottom: 8px;
        }

        .drop-zone {
            border: 2px dashed var(--hairline);
            border-radius: 8px;
            padding: 32px 24px;
            text-align: center;
            transition: all 0.2s ease;
            background-color: var(--canvas);
            cursor: pointer;
        }

        .drop-zone.dragging {
            border-color: var(--link);
            background-color: rgba(0, 112, 243, 0.05);
        }

        .drop-zone.dragging, .drop-zone:hover {
            border-color: var(--link);
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background-color: var(--canvas);
            border: 1px solid var(--hairline);
            border-radius: 6px;
            font-size: 14px;
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--mute);
            cursor: pointer;
            font-size: 16px;
            padding: 0;
        }

        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 12px 12px;
            border: 1px solid var(--hairline);
            border-radius: 6px;
            font-family: var(--font-sans);
            font-size: 14px;
            background-color: var(--canvas);
            color: var(--ink);
        }

        input[type="file"] {
            display: none;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--link);
            box-shadow: 0 0 0 3px rgba(0, 112, 243, 0.1);
        }

        .transfer-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
        }

        .transfer-modal.active {
            display: flex;
        }

        .transfer-card {
            background-color: var(--canvas);
            border-radius: 8px;
            padding: 32px;
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-shadow: 0 24px 32px -8px rgba(0, 0, 0, 0.15);
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .caption-mono {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--mute);
        }

        .qr-display {
            width: 200px;
            height: 200px;
            border: 1px solid var(--hairline);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            padding: 8px;
        }

        canvas {
            max-width: 100%;
            height: auto;
        }

        .code-display {
            font-family: var(--font-mono);
            font-size: 14px;
            letter-spacing: 2px;
            background-color: var(--canvas-soft);
            padding: 12px;
            border-radius: 6px;
            word-break: break-all;
        }

        .progress-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: var(--hairline);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gradient-develop-start), var(--gradient-develop-end));
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            font-size: 14px;
            color: var(--body);
        }

        .logs {
            background-color: var(--canvas-soft-2);
            border-radius: 6px;
            padding: 12px;
            max-height: 150px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 11px;
        }

        .log-line {
            color: var(--mute);
            margin: 2px 0;
            word-break: break-all;
        }

        .done-message {
            text-align: center;
            color: var(--link);
            font-weight: 600;
            font-size: 18px;
        }

        .divider {
            text-align: center;
            color: var(--mute);
            font-size: 12px;
            margin: 8px 0;
        }

        .body-sm {
            font-size: 14px;
            font-weight: 400;
            line-height: 20px;
        }

        @media (max-width: 600px) {
            .display-xl {
                font-size: 36px;
            }

            .transfer-card {
                padding: 24px;
            }

            button {
                width: 100%;
                min-width: auto;
            }

            .cta-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Idle Screen -->
        <div id="idle-screen" class="screen active">
            <div class="hero">
                <h1 class="display-xl">Blink</h1>
                <p class="body-lg">Secure, P2P file transfer.<br>No accounts. No limits.</p>
            </div>
            <div class="cta-row">
                <button class="button-primary" onclick="goToSend()">Send</button>
                <button class="button-secondary" onclick="goToRecv()">Receive</button>
            </div>
        </div>

        <!-- Send Screen -->
        <div id="send-screen" class="screen">
            <button class="back-btn" onclick="goHome()">← Back</button>
            <div class="view">
                <h2 class="display-md">Send Files</h2>
                <div class="drop-zone" id="drop-zone" ondrop="handleDrop(event)" ondragover="event.preventDefault(); document.getElementById('drop-zone').classList.add('dragging')" ondragleave="document.getElementById('drop-zone').classList.remove('dragging')">
                    <p class="body-sm">Drag files here or tap to browse</p>
                </div>
                <div id="file-list" class="file-list"></div>
                <button class="button-primary" id="send-btn" onclick="startSend()" disabled>Send Files</button>
            </div>
        </div>

        <!-- Receive Screen -->
        <div id="recv-screen" class="screen">
            <button class="back-btn" onclick="goHome()">← Back</button>
            <div class="view">
                <h2 class="display-md">Receive Files</h2>
                <button class="button-primary" onclick="pasteCode()">📋 Paste Transfer Code</button>
                <div class="divider">or</div>
                <input type="text" id="code-input" placeholder="Enter transfer code" />
                <button class="button-primary" id="recv-btn" onclick="startRecv()" disabled>Receive</button>
            </div>
        </div>
    </div>

    <!-- Transfer Modal -->
    <div id="transfer-modal" class="transfer-modal">
        <div class="transfer-card">
            <div id="qr-section" class="qr-section">
                <p class="caption-mono">Transfer Code</p>
                <div class="qr-display" id="qr-display"></div>
                <p class="code-display" id="code-display"></p>
            </div>

            <div class="progress-section">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <p class="progress-text" id="progress-text">0%</p>
            </div>

            <div class="logs" id="logs"></div>

            <p id="done-message" class="done-message" style="display: none;">✓ Complete</p>

            <button class="button-secondary" id="cancel-btn" onclick="cancelTransfer()">Cancel</button>
        </div>
    </div>

    <input type="file" id="file-input" multiple onchange="handleFileInput(event)">

    <script>
        const PUBLIC_RELAY = "https://croc.schollz.com";
        let selectedFiles = [];
        let currentTransfer = null;

        function goHome() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('idle-screen').classList.add('active');
            document.getElementById('transfer-modal').classList.remove('active');
        }

        function goToSend() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('send-screen').classList.add('active');
            selectedFiles = [];
            updateFileList();
        }

        function goToRecv() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('recv-screen').classList.add('active');
            document.getElementById('code-input').value = '';
            updateRecvButton();
        }

        function handleDrop(e) {
            e.preventDefault();
            document.getElementById('drop-zone').classList.remove('dragging');
            const files = Array.from(e.dataTransfer.files);
            selectedFiles.push(...files);
            updateFileList();
        }

        function handleFileInput(e) {
            const files = Array.from(e.target.files);
            selectedFiles.push(...files);
            updateFileList();
        }

        function updateFileList() {
            const list = document.getElementById('file-list');
            list.innerHTML = selectedFiles.map((f, i) => `
                <div class="file-item">
                    <span class="body-sm">${f.name}</span>
                    <button class="remove-btn" onclick="removeFile(${i})">✕</button>
                </div>
            `).join('');
            document.getElementById('send-btn').disabled = selectedFiles.length === 0;
            document.getElementById('drop-zone').onclick = () => document.getElementById('file-input').click();
        }

        function removeFile(i) {
            selectedFiles.splice(i, 1);
            updateFileList();
        }

        function updateRecvButton() {
            document.getElementById('recv-btn').disabled = !document.getElementById('code-input').value.trim();
        }

        document.getElementById('code-input').addEventListener('input', updateRecvButton);

        async function startSend() {
            if (selectedFiles.length === 0) return;

            // Generate a random code (simplified — real croc uses word-based codes)
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();

            document.getElementById('transfer-modal').classList.add('active');
            document.getElementById('qr-section').style.display = 'flex';
            document.getElementById('code-display').textContent = code;
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('progress-text').textContent = '0%';
            document.getElementById('logs').innerHTML = '';
            document.getElementById('done-message').style.display = 'none';
            document.getElementById('cancel-btn').style.display = 'block';

            addLog(`Send code: ${code}`);
            addLog('Waiting for receiver...');
            addLog(`Public relay: ${PUBLIC_RELAY}`);

            // Generate QR code
            generateQR(code);

            // Simulate transfer progress (real implementation would use croc relay)
            for (let i = 0; i <= 100; i += 10) {
                await new Promise(resolve => setTimeout(resolve, 500));
                document.getElementById('progress-fill').style.width = i + '%';
                document.getElementById('progress-text').textContent = i + '%';
                if (i === 50) addLog('Files transferring...');
            }

            document.getElementById('done-message').style.display = 'block';
            document.getElementById('cancel-btn').textContent = 'Done';
        }

        async function startRecv() {
            const code = document.getElementById('code-input').value.trim();
            if (!code) return;

            document.getElementById('transfer-modal').classList.add('active');
            document.getElementById('qr-section').style.display = 'none';
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('progress-text').textContent = '0%';
            document.getElementById('logs').innerHTML = '';
            document.getElementById('done-message').style.display = 'none';
            document.getElementById('cancel-btn').style.display = 'block';

            addLog(`Receive code: ${code}`);
            addLog('Connecting to sender...');

            for (let i = 0; i <= 100; i += 15) {
                await new Promise(resolve => setTimeout(resolve, 400));
                document.getElementById('progress-fill').style.width = i + '%';
                document.getElementById('progress-text').textContent = i + '%';
                if (i === 50) addLog('Receiving files...');
            }

            document.getElementById('done-message').style.display = 'block';
            document.getElementById('cancel-btn').textContent = 'Done';
        }

        function addLog(msg) {
            const logs = document.getElementById('logs');
            const line = document.createElement('p');
            line.className = 'log-line';
            line.textContent = msg;
            logs.appendChild(line);
            logs.scrollTop = logs.scrollHeight;
        }

        function cancelTransfer() {
            goHome();
        }

        async function pasteCode() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('code-input').value = text.trim();
                updateRecvButton();
            } catch (e) {
                alert('Paste failed. Please enter code manually.');
            }
        }

        function generateQR(text) {
            // Simplified QR — real version would use qrcode.js library
            const qrDisplay = document.getElementById('qr-display');
            qrDisplay.innerHTML = `<p style="color: #888; font-size: 12px;">QR Code<br>${text}</p>`;
        }

        // Service Worker registration for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
